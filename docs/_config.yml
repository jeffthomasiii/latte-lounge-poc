title: "Latte & Lounge"
tagline: "A sacred pause before the world gets loud."
description: "Scripture, prayer, honest conversations, and practical wisdom for professional women who want to set their day with God."
url: "https://jeffthomasiii.github.io"
baseurl: "/latte-lounge-poc"

permalink: /blog/:title/

collections:
  podcast:
    output: true
    permalink: /podcast/:name/
  prayers:
    output: true
    permalink: /prayer-resources/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "podcast"
    values:
      layout: podcast
  - scope:
      path: ""
      type: "prayers"
    values:
      layout: resource

markdown: kramdown
