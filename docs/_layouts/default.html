<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    {% assign meta_description = page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines %}
    <meta name="description" content="{{ meta_description | escape }}">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F6F2ED">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Latte & Lounge">

    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/luxury-refinement.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/homepage-phase2.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/homepage-hero-adjustments.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/homepage-lower-adjustments.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/collection-phase3.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/phase4-responsive.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/mobile-refinements.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/visual-refresh.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/production-assets-mobile-nav.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/editorial-components.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/alignment-fixes.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/mobile-pwa-refresh.css' | relative_url }}">
    <script src="{{ '/assets/js/pwa.js' | relative_url }}" defer></script>
  </head>

  <body class="layout-{{ page.layout | default: 'default' }} page-{{ page.title | default: 'home' | slugify }}{% if page.url == '/' %} is-home{% endif %}">
    {% include header.html %}

    <main class="site-main">
      {{ content }}
    </main>

    {% include footer.html %}
    {% include mobile-bottom-nav.html %}
  </body>
</html>
